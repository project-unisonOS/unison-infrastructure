schema_version: unison-environment-profile.v1
profile_id: dev-nuc
state: active
role: linux-development-integration
os_family: ubuntu
canonical_runtime: true
capabilities:
  - python-3.12
  - container-build
  - clean-worktree-validation
  - tailscale-ssh-target
workspace:
  default_path: /srv/unison/unison-workspace
  source_of_truth: github
  required_entrypoints:
    - ./scripts/bootstrap-dev.sh
    - ./scripts/validate-phase0.sh
    - ./scripts/test-unit.sh
    - ./scripts/test-boundaries.sh
access:
  transports: [local-ssh, tailscale-ssh]
  host_key_verification_required: true
  passwordless_sudo_required: false
  windows_filesystem_mount_required: false
prohibitions:
  - production-claim
  - physical-hardware-qualification-without-fixture
evidence_class: simulation
